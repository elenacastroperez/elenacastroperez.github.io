name: Prepare RECATO gallery

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/prepare-recato.yml"\n      - "script.js"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optimize RECATO images
        run: |
          python -m pip install --upgrade pip pillow
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image, ImageOps
          import json, io

          root = Path(".")
          out = root / "assets" / "recato"
          out.mkdir(parents=True, exist_ok=True)

          for old in out.glob("*.webp"):
              old.unlink()

          image_exts = {".jpg", ".jpeg", ".png", ".webp", ".tif", ".tiff"}
          files = []
          for archive in sorted(root.glob("*.zip")):
              try:
                  with ZipFile(archive) as z:
                      for item in z.infolist():
                          p = Path(item.filename)
                          if item.is_dir() or "__MACOSX" in p.parts or p.suffix.lower() not in image_exts:
                              continue
                          try:
                              raw = z.read(item)
                              im = Image.open(io.BytesIO(raw))
                              im = ImageOps.exif_transpose(im)
                              if im.mode not in ("RGB", "RGBA"):
                                  im = im.convert("RGB")
                              name = f"{archive.stem.replace(' ', '-')}--{p.stem.replace(' ', '-')}.webp"
                              target = out / name
                              im.save(target, "WEBP", quality=84, method=6)
                              files.append(name)
                          except Exception as e:
                              print(f"Skipped {archive.name}:{item.filename}: {e}")
              except Exception as e:
                  print(f"Could not read {archive.name}: {e}")

          files = sorted(set(files))
          (out / "manifest.json").write_text(json.dumps(files, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Prepared {len(files)} images")
          PY
      - name: Commit optimized gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/recato
          if git diff --cached --quiet; then
            echo "No gallery changes to commit."
          else
            git commit -m "Prepare optimized RECATO gallery"
            git push
          fi
